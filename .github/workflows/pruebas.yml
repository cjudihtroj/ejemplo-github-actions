name: Pruebas automatizadas de API y web

on:                                   # ¿CUÁNDO se ejecuta?
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:                  # botón "Run workflow" para ejecutarlo a mano

jobs:
  api:
    name: Pruebas de API
    runs-on: ubuntu-latest            # ¿DÓNDE? una máquina limpia en cada run
    defaults:
      run:
        working-directory: api
    steps:                            # ¿QUÉ? en orden
      - uses: actions/checkout@v6     # 1. descargar el código
      - uses: actions/setup-python@v6 # 2. instalar Python
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: pytest --junitxml=reportes/api-junit.xml --html=reportes/api-reporte.html --self-contained-html
      - name: Resumen en la página del run
        if: ${{ !cancelled() }}
        run: python ../.github/scripts/resumen_junit.py "Pruebas de API" reportes/api-junit.xml
      - name: Publicar reporte
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: reporte-api
          path: api/reportes/

  web:
    name: Pruebas web (E2E)
    needs: api                        # solo si la API pasó (lo rápido primero)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Instalar dependencias
        run: npm ci                   # instala exactamente lo del package-lock.json
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas
        run: npm test                 # bddgen && playwright test
      - name: Resumen en la página del run
        if: ${{ !cancelled() }}
        run: python3 ../.github/scripts/resumen_junit.py "Pruebas web (E2E)" reportes/web-junit.xml
      - name: Publicar reporte
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: reporte-web
          path: |
            web/playwright-report/
            web/test-results/
            web/reportes/
          retention-days: 30

  reportes:
    name: Publicar reportes (GitHub Pages)
    needs: [api, web]
    # también cuando fallan las pruebas, pero solo desde main (un PR no reemplaza el sitio)
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write                    # publicar en GitHub Pages
      id-token: write                 # lo exige actions/deploy-pages
      actions: read
    concurrency:                      # un despliegue a la vez; no se cancela uno a medias
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6     # solo para tener el script de la portada
      - name: Descargar los reportes del run
        uses: actions/download-artifact@v7
        with:
          path: sitio                 # una subcarpeta por artefacto: sitio/reporte-api, sitio/reporte-web
      - name: Armar la portada
        run: python3 .github/scripts/indice_reportes.py sitio
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
      - name: Enlace en la página del run
        run: echo "## 📊 Reportes publicados en ${{ steps.despliegue.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
